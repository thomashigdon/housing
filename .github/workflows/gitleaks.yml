name: gitleaks

# Scans the commits each push or PR adds, and flags commits that weren't scanned by the local
# hook (no "Scanned-by: gitleaks" trailer). Run it manually to scan the full history.
# Turn off the trailer check for a repo with the Actions variable REQUIRE_SCANNED_BY=false.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks

      - name: Pick commits
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          range=
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = push ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              range="$BEFORE..$GITHUB_SHA"
            elif [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ] && git rev-parse -q --verify "origin/$DEFAULT_BRANCH" >/dev/null; then
              range="origin/$DEFAULT_BRANCH..$GITHUB_SHA"
            fi
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Scan for secrets
        env:
          RANGE: ${{ steps.pick.outputs.range }}
        run: |
          echo "Scanning: ${RANGE:-full history}"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner -v ${RANGE:+--log-opts="$RANGE"} .

      - name: Check commits were scanned locally
        if: steps.pick.outputs.range != '' && vars.REQUIRE_SCANNED_BY != 'false'
        env:
          RANGE: ${{ steps.pick.outputs.range }}
        run: |
          # Commits made on GitHub (web edits, merge buttons) and by bots never run local hooks.
          missing=$(git log --no-merges --format='%H%x09%ce%x09%an%x09%cn%x09%s' "$RANGE" |
            while IFS="$(printf '\t')" read -r sha cemail aname cname subject; do
              [ "$cemail" = noreply@github.com ] && continue
              case "$aname$cname" in *'[bot]'*) continue ;; esac
              git log -1 --format=%B "$sha" | grep -qx 'Scanned-by: gitleaks' || echo "${sha:0:8} $subject"
            done)
          if [ -n "$missing" ]; then
            echo "::error::Commits without a 'Scanned-by: gitleaks' trailer. The client that made them doesn't have the gitleaks hook (or skipped it):"
            echo "$missing"
            echo
            echo "Set up that client: https://github.com/thomashigdon/git-hooks#set-up-a-new-client"
            exit 1
          fi
          echo "All commits were scanned locally."
